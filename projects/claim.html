<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Claim — Polina Mogilnaya</title>
    <meta
        name="description"
        content="Album artwork and visual identity by Polina Mogilnaya."
    >

    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="site-header">
        <a href="../index.html" class="logo" aria-label="Polina Mogilnaya">
            <img src="../images/logo.webp" width="1200" height="669" alt="">
        </a>

        <button
            class="menu-button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="site-menu"
            type="button"
        >
            =
        </button>

        <nav class="site-menu" id="site-menu">
            <a href="../index.html#work" class="active">work</a>
            <a href="../about.html">about</a>
            <a href="../contact.html">contact</a>
            <img class="menu-stamp" src="../images/stamp.webp" width="600" height="782" alt="">
        </nav>
    </header>

    <main class="claim-page">

        <div class="page-copy">
            <div class="project-description">
                <p>
                    Graphic and motion design for the promotional campaign for Claim's EP
                    <a class="text-link" href="https://band.link/braingenerator" target="_blank" rel="noopener noreferrer">Brain Generator</a>.
                </p>
                <p>
                    In collaboration with Sonia Rosales Riofrio. Album cover by Arina Renasci.
                </p>
            </div>
        </div>

        <video class="claim-video" autoplay muted loop playsinline>
            <source src="../images/claim-video.mp4" type="video/mp4">
        </video>

        <img
            class="claim-photo"
            src="../images/claim-cover.webp"
            width="1800"
            height="1899"
            loading="lazy"
            decoding="async"
            alt="Claim band"
        >

        <video class="claim-logo-video claim-diskspin-video" autoplay muted loop playsinline>
            <source src="../images/claim-disk.mp4" type="video/mp4">
        </video>

        <video class="claim-logo-video" autoplay muted loop playsinline>
            <source src="../images/claim-logo.mp4" type="video/mp4">
        </video>

    </main>

    <footer>
        directed by POLINA MOGILNAYA
    </footer>

    <script src="../script.js"></script>
</body>
</html>
