
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAILED</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            flex: 1;
            width: 100%;
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 22px;
        }

        .error-page h1 {
            margin: 0 0 24px;
            text-align: center;
        }

        .error-page .error-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            margin: 0 0 24px;
        }

        .error-page a {
            color: inherit;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <h1>FAILED</h1>
        <img
            src="images/failed.png"
            alt="FAILED"
            class="error-image"
        >
        <a href="/polinamogilnaya-portfolio/">go home</a>
    </main>
</body>
</html>
