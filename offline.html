
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAILED</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 30px 22px;
            color: #111;
            font-family: "Times New Roman", Times, serif;
        }

        main {
            min-height: calc(100vh - 60px);
            min-height: calc(100dvh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(64px, 15vw, 180px);
            font-weight: 400;
            line-height: 0.9;
            text-align: center;
        }

        img {
            display: block;
            width: 100%;
            max-width: 600px;
            height: auto;
            margin-bottom: 24px;
        }

        a {
            color: inherit;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <h1>FAILED</h1>
        <img src="images/failed.png" alt="FAILED">
        <a href="/polinamogilnaya-portfolio/">retry</a>
    </main>
</body>
</html>
